name: futivo
description: "Futivo - Pro sport fantasy football app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  provider: ^6.1.5+1
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/iconnn.png
    - assets/futivo_logo.png
    - assets/futivo_news_hero.png
    - assets/login_bg.png
    - assets/images/clubs/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/futivo_logo.png"
    background_color: "#06140E"
    theme_color: "#FF1F4B"
  image_path: "assets/futivo_logo.png"
  adaptive_icon_background: "#06140E"
  adaptive_icon_foreground: "assets/futivo_logo.png"
